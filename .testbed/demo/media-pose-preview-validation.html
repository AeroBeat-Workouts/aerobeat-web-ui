<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AeroBeat Media Pose Preview Validation</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        padding: 24px;
        place-items: start center;
      }

      aero-media-pose-preview {
        height: 360px;
        width: 640px;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { defineAeroUiElements } from "../../src/index.js";
      import { aeroMediaPosePreviewDebugData } from "../debug-data/aero-media-pose-preview.debug-data.js";

      defineAeroUiElements();

      const preview = document.createElement("aero-media-pose-preview");
      const calls = [];
      const renderer = {
        serviceId: "aero.renderer.playcanvas",
        canvas: null,
        attach(canvas) {
          this.canvas = canvas;
          calls.push({ type: "attach", width: canvas.width, height: canvas.height });
          return this.describe();
        },
        resize(size) {
          calls.push({ type: "resize", size: { ...size } });
          if (this.canvas) {
            this.canvas.style.width = `${size.widthCssPx}px`;
            this.canvas.style.height = `${size.heightCssPx}px`;
            this.canvas.width = Math.round(size.widthCssPx * Math.min(size.devicePixelRatio, 2));
            this.canvas.height = Math.round(size.heightCssPx * Math.min(size.devicePixelRatio, 2));
          }
          return this.describe();
        },
        detach() {
          calls.push({ type: "detach" });
          this.canvas = null;
          return this.describe();
        },
        describe() {
          return {
            serviceId: "aero.renderer.playcanvas",
            state: this.canvas ? "running" : "unsupported",
            supported: Boolean(this.canvas),
            attached: Boolean(this.canvas),
            frameCount: calls.filter((call) => call.type === "clear").length,
            drawCount: calls.filter((call) => call.type === "overlay").length,
            viewportWidth: this.canvas?.width ?? 0,
            viewportHeight: this.canvas?.height ?? 0,
            errorMessage: undefined
          };
        },
        clear(options = {}) {
          calls.push({ type: "clear", options });
          return { status: this.describe() };
        },
        renderFrame(options = {}) {
          calls.push({ type: "frame", options });
          return { status: this.describe() };
        },
        renderLandmarkOverlay(landmarks, options = {}) {
          calls.push({
            type: "overlay",
            landmarks: landmarks.map((landmark) => ({ ...landmark })),
            options: {
              ...options,
              surface: { ...options.surface },
              connections: [...(options.connections ?? [])]
            }
          });
          return {
            status: this.describe(),
            pointCount: landmarks.length,
            lineVertexCount: 0
          };
        }
      };

      preview.setRenderer(renderer);
      document.body.append(preview);
      preview.setSurfaceDescriptor(aeroMediaPosePreviewDebugData.surface);
      preview.setPoseFrame(aeroMediaPosePreviewDebugData.firstPoseFrame);
      await new Promise((resolve) => requestAnimationFrame(resolve));
      const firstSnapshot = preview.describePreview();
      preview.setTrackingProfile("smoother");
      preview.setSurfaceDescriptor({
        ...aeroMediaPosePreviewDebugData.surface,
        fitMode: "cover",
        mirrored: false
      });
      preview.setPoseFrame(aeroMediaPosePreviewDebugData.secondPoseFrame);
      await new Promise((resolve) => requestAnimationFrame(resolve));
      const smootherSnapshot = preview.describePreview();
      preview.setTrackingProfile("fast");
      preview.setPoseFrame({
        ...aeroMediaPosePreviewDebugData.secondPoseFrame,
        timestampMs: aeroMediaPosePreviewDebugData.secondPoseFrame.timestampMs + 1
      });
      await new Promise((resolve) => requestAnimationFrame(resolve));
      const secondSnapshot = preview.describePreview();
      const legacyCanvas = describeCanvas(preview);

      preview.setTrackingProfile("smoother");
      preview.setPoseRoutingSample({
        schema: "aerobeat/pose_routing_sample",
        version: 1,
        sourceId: aeroMediaPosePreviewDebugData.secondPoseFrame.sourceId,
        routeEpoch: "validation-route-1",
        measuredSourceFrameId: "validation-route-1:1301",
        targetTimestampMs: 1360,
        measurementTimestampMs: 1301,
        predictionHorizonMs: 59,
        provenance: "predicted",
        mirrored: false,
        landmarks: aeroMediaPosePreviewDebugData.secondPoseFrame.landmarks.map((landmark) => (
          landmark.name === "left_wrist" ? { ...landmark, x: 0.74 } : landmark
        ))
      });
      const predictedSnapshot = preview.describePreview();
      const predictedCanvas = describeCanvas(preview);

      preview.setPoseRoutingSample({
        schema: "aerobeat/pose_routing_sample",
        version: 1,
        sourceId: aeroMediaPosePreviewDebugData.secondPoseFrame.sourceId,
        routeEpoch: "validation-route-1",
        measuredSourceFrameId: "validation-route-1:1400",
        targetTimestampMs: 1400,
        measurementTimestampMs: 1400,
        predictionHorizonMs: 0,
        provenance: "measured",
        mirrored: false,
        landmarks: aeroMediaPosePreviewDebugData.secondPoseFrame.landmarks.map((landmark) => (
          landmark.name === "left_wrist" ? { ...landmark, x: 0.12 } : landmark
        ))
      });
      const measuredRoutingSnapshot = preview.describePreview();
      const measuredRoutingOverlay = calls.filter((call) => call.type === "overlay" && call.landmarks.length > 0).at(-1);

      preview.setPoseRoutingSample(undefined);
      const clearedSnapshot = preview.describePreview();
      const clearedCanvas = describeCanvas(preview);

      const actualPreview = document.createElement("aero-media-pose-preview");
      document.body.append(actualPreview);
      actualPreview.setSurfaceDescriptor(aeroMediaPosePreviewDebugData.surface);
      actualPreview.setTrackingProfile("fast");
      actualPreview.setPoseFrame(aeroMediaPosePreviewDebugData.secondPoseFrame);
      actualPreview.renderPreview();
      const actualCanvas = actualPreview.shadowRoot.querySelector("canvas");
      const initialActualCanvas = actualCanvas;
      const actualPixels = sampleCanvas(actualCanvas);
      const actualStatus = actualPreview.renderer.describe();
      const actualCapabilities = actualPreview.renderer.getCapabilities();
      actualPreview.remove();
      const detachedStatus = actualPreview.renderer.describe();
      document.body.append(actualPreview);
      actualPreview.renderPreview();
      const reconnectedStatus = actualPreview.renderer.describe();
      const reconnectedPixels = sampleCanvas(actualCanvas);

      window.__aeroPreviewValidation = {
        firstSnapshot,
        smootherSnapshot,
        secondSnapshot,
        predictedSnapshot,
        measuredRoutingSnapshot,
        measuredRoutingOverlay,
        clearedSnapshot,
        predictedCanvas,
        clearedCanvas,
        calls,
        actual: {
          status: actualStatus,
          capabilities: actualCapabilities,
          pixels: actualPixels,
          detachedStatus,
          reconnectedStatus,
          reconnectedPixels,
          stableCanvas: actualCanvas === initialActualCanvas,
          canvas: describeCanvas(actualPreview)
        },
        video: {
          fitMode: preview.shadowRoot.querySelector("video").dataset.fitMode,
          mirrored: preview.shadowRoot.querySelector("video").dataset.mirrored,
          sourceKind: preview.shadowRoot.querySelector("video").dataset.sourceKind,
          sourceId: preview.shadowRoot.querySelector("video").dataset.sourceId
        },
        canvas: legacyCanvas
      };

      function sampleCanvas(canvas) {
        const sample = document.createElement("canvas");
        sample.width = canvas.width;
        sample.height = canvas.height;
        const context = sample.getContext("2d", { willReadFrequently: true });
        context.drawImage(canvas, 0, 0);
        const pixels = context.getImageData(0, 0, sample.width, sample.height).data;
        let nonTransparent = 0;
        let partialAlpha = 0;
        for (let index = 3; index < pixels.length; index += 4) {
          if (pixels[index] > 0) nonTransparent += 1;
          if (pixels[index] > 0 && pixels[index] < 255) partialAlpha += 1;
        }
        return { nonTransparent, partialAlpha };
      }

      function describeCanvas(element) {
        const canvas = element.shadowRoot.querySelector("canvas");
        return {
          width: canvas.width,
          height: canvas.height,
          landmarkCount: canvas.dataset.landmarkCount,
          trackingProfile: canvas.dataset.trackingProfile,
          mediaPoseDeltaMs: canvas.dataset.mediaPoseDeltaMs,
          presentationTargetDeltaMs: canvas.dataset.presentationTargetDeltaMs,
          poseProvenance: canvas.dataset.poseProvenance,
          measurementTimestampMs: canvas.dataset.measurementTimestampMs,
          predictionHorizonMs: canvas.dataset.predictionHorizonMs,
          contentRect: JSON.parse(canvas.dataset.contentRect)
        };
      }
    </script>
  </body>
</html>
