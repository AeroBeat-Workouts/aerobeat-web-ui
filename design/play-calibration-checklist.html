<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AeroBeat — synthetic Play calibration checklist concept</title>
<style>
:root{font-family:system-ui,sans-serif;color:#eaf9ff;background:#06141f;color-scheme:dark}
*{box-sizing:border-box}body{margin:0}main{position:relative;isolation:isolate;width:100%;height:100dvh;min-height:300px;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#18495b 0%,#102c3d 35%,#06141f 82%)}
/* Abstract synthetic stage only: no camera, media, renderer, or game assets. */
.stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,transparent 30%,#07202c 100%)}.horizon{position:absolute;top:60%;left:0;width:100%;height:1px;background:#4ac2d1;opacity:.32}.lane{position:absolute;top:60%;left:50%;width:min(70vw,780px);height:60%;transform:translateX(-50%);clip-path:polygon(36% 0,64% 0,100% 100%,0 100%);background:repeating-linear-gradient(0deg,transparent 0 46px,#c3f6ff16 47px 48px),linear-gradient(90deg,#88dfea19,#76d5e21a,#88dfea19);border-top:1px solid #9cecf77a}.lane:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 32%,#c1f9ff29 32.2%,transparent 32.6%,transparent 67%,#c1f9ff29 67.2%,transparent 67.6%)}
.brand{position:absolute;top:12px;left:12px;z-index:2;color:#d9f8ff;background:#03131fbd;border:1px solid #ffffff3d;border-radius:6px;padding:3px 8px;font:700 12px/1.4 system-ui}.brand span{color:#8ddde9}.menu{position:absolute;top:8px;right:8px;width:48px;height:48px;border:1px solid #ffffff57;border-radius:12px;background:#03131f;display:grid;place-content:center;gap:4px;z-index:2}.menu i{display:block;width:24px;height:4px;border-radius:5px;background:#fff}.menu:after{content:"";position:absolute;inset:0}
/* The single shell cue matches the real assembled Play positioning/tone; checklist is proposed underneath. */
.cue{position:absolute;z-index:4;top:18%;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);white-space:nowrap;border:1px solid #ffffff57;border-radius:12px;background:#03131f;color:#fff;font:900 clamp(24px,8vw,52px)/1 system-ui;text-align:center;text-shadow:0 2px 8px #000;padding:8px 10px}.cue span{display:block;font:700 11px/1.25 system-ui;letter-spacing:.08em;text-transform:uppercase;color:#a2d8e5;text-shadow:none;margin:0 0 5px}
.panel{position:absolute;z-index:3;left:50%;top:calc(18% + clamp(78px,10vw,90px));transform:translateX(-50%);width:min(92vw,420px);max-height:calc(100% - 18% - clamp(78px,10vw,90px) - 15px);overflow:auto;overscroll-behavior:contain;border:1px solid #ffffff57;border-radius:12px;background:#03131fee;box-shadow:0 16px 48px #0008;padding:12px 14px 13px}.panel header{padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid #ffffff38}.eyebrow{font:800 10px/1.3 system-ui;text-transform:uppercase;letter-spacing:.12em;color:#87e2f0}.panel h1{font:800 17px/1.15 system-ui;margin:3px 0}.panel p{font:600 11px/1.35 system-ui;color:#bbd8df;margin:2px 0 0}.rows{list-style:none;padding:0;margin:0;display:grid;gap:3px}.row{display:grid;grid-template-columns:16px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:24px;font:650 12px/1.2 system-ui}.row .icon{width:16px;height:16px;border:1.5px solid #86dbd1;border-radius:4px;display:grid;place-items:center;color:#081d27;background:#82ddc2;font:900 12px/1 system-ui}.row .value{color:#9af0d0;font:800 11px/1 system-ui}.row.missing .icon{background:#432724;border-color:#ffb390;color:#ffcaac}.row.missing .value{color:#ffbf9e}.row.waiting .icon{background:#1b3541;border-color:#87b0bf;color:#a4d8e5}.row.waiting .value{color:#b4d0dd}.row.holding .icon{background:#31512d;border-color:#c7ed78;color:#eaffbb}.row.holding .value{color:#dbf39a}.row.done .icon{background:#b9f4c3;color:#082b25}.row.done .value{color:#d5ffda}.divider{border-top:1px solid #ffffff38;margin:7px 0}.progress{height:4px;border-radius:4px;background:#375160;margin:7px 0 0;overflow:hidden}.progress>span{display:block;height:100%;background:#d7f88f;width:var(--progress)}.foot{display:flex;justify-content:space-between;gap:8px;margin-top:6px;color:#c4dfe3;font:700 10px/1.3 system-ui}.sample{position:absolute;bottom:8px;left:8px;right:8px;z-index:2;color:#c9edf3;background:#03131fdb;border-radius:7px;padding:5px 8px;width:max-content;max-width:calc(100% - 16px);font:700 10px/1.25 system-ui}
@media(max-height:480px){.cue{top:9%;left:25%;font-size:clamp(22px,4vw,30px)}.panel{top:9%;left:auto;right:10px;transform:none;width:min(57vw,440px);height:auto;max-height:calc(91% - 8px);padding:5px 11px}.panel header{padding-bottom:3px;margin-bottom:3px}.row{min-height:17px;gap:6px}.rows{gap:1px}.divider{margin:3px 0}.progress{margin-top:3px}.foot{margin-top:2px}.panel h1{font-size:14px}.panel p{font-size:10px}.sample{max-width:35vw}.lane{top:56%}.horizon{top:56%}}
</style>
</head>
<body><main aria-label="Synthetic AeroBeat Play shell calibration design">
<div class="stage" aria-hidden="true"><div class="horizon"></div><div class="lane"></div></div>
<div class="brand" aria-hidden="true">AERO<span>BEAT</span> <span>· PLAY</span></div><div class="menu" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="cue"><span>Play calibration</span><b id="cueText">T-pose</b></div>
<section class="panel" aria-label="Read-only live calibration checklist"><header><div class="eyebrow" id="mode"></div><h1>Calibration checklist</h1><p id="subtitle"></p></header><ul class="rows" id="landmarks"></ul><div class="divider"></div><ul class="rows" id="pose"></ul><div class="progress" role="img" id="progress" aria-label="Hold progress"><span></span></div><div class="foot"><span id="detail"></span><span id="elapsed"></span></div></section>
<div class="sample" id="sample"></div>
</main>
<script>
const all=['Visible Nose','Visible Left Wrist','Visible Right Wrist','Visible Left Shoulder','Visible Right Shoulder','Visible Left Elbow','Visible Right Elbow','Visible Left Knee','Visible Right Knee'];
const states={
 'knee-flicker':{mode:'BOXING · KNEE STRIKES ON · 0% CHANCE',subtitle:'Both knees must be visible now, even at 0%.',missing:['Visible Right Knee'],cue:'T-pose',detail:'Right knee lost · hold resets',elapsed:'0 / 2 sec',progress:0,sample:'SYNTHETIC REVIEW · partial knee flicker · hold reset'},
 holding:{mode:'BOXING · KNEE STRIKES ON · 0% CHANCE',subtitle:'All required landmarks visible in this frame.',missing:[],cue:'Hold T-pose',detail:'Keep arms level and elbows straight',elapsed:'1.2 / 2 sec',progress:60,sample:'SYNTHETIC REVIEW · holding · 1.2 / 2 sec'},
 complete:{mode:'BOXING · KNEE STRIKES ON · 0% CHANCE',subtitle:'Two-second T-pose captured.',missing:[],cue:'Release',detail:'Calibration complete · release pose',elapsed:'2 / 2 sec',progress:100,sample:'SYNTHETIC REVIEW · complete · release pose'},
 flow:{mode:'FLOW · KNEES NOT REQUIRED',subtitle:'Upper-body landmarks only.',missing:[],cue:'Hold T-pose',detail:'Knee rows omitted in Flow',elapsed:'0.8 / 2 sec',progress:40,sample:'SYNTHETIC REVIEW · Flow · no knee rows',knees:false},
 'boxing-knees-off':{mode:'BOXING · KNEE STRIKES OFF',subtitle:'Upper-body landmarks only.',missing:[],cue:'T-pose',detail:'Knee rows omitted while knee strikes are off',elapsed:'0 / 2 sec',progress:0,sample:'SYNTHETIC REVIEW · Boxing knee strikes off',knees:false}
};
const key=new URLSearchParams(location.search).get('state')||'knee-flicker';const state=states[key]||states['knee-flicker'];
const row=(label,status,value)=>{const li=document.createElement('li');li.className=`row ${status}`;const icon=document.createElement('span');icon.className='icon';icon.setAttribute('aria-hidden','true');icon.textContent=status==='missing'?'!':status==='waiting'?'·':'✓';const name=document.createElement('span');name.textContent=label;const output=document.createElement('span');output.className='value';output.textContent=value;li.append(icon,name,output);return li};
for(const label of all.filter(label=>state.knees!==false||!label.includes('Knee'))){const missing=state.missing.includes(label);document.querySelector('#landmarks').append(row(label,missing?'missing':'seen',missing?'Missing':'Seen'))}
const poseStatus=key==='knee-flicker'?'waiting':key==='complete'?'done':key==='boxing-knees-off'?'waiting':'holding';
for(const label of ['Arms level','Elbows straight'])document.querySelector('#pose').append(row(label,key==='boxing-knees-off'?'waiting':'seen',key==='boxing-knees-off'?'Waiting':'Ready'));
document.querySelector('#pose').append(row('Hold T-pose for 2 seconds',poseStatus,key==='complete'?'Complete':poseStatus==='holding'?'Holding':'Waiting'));
for(const [id,value] of Object.entries({mode:state.mode,subtitle:state.subtitle,cueText:state.cue,detail:state.detail,elapsed:state.elapsed,sample:state.sample}))document.getElementById(id).textContent=value;
document.querySelector('#progress').style.setProperty('--progress',`${state.progress}%`);document.querySelector('#progress').setAttribute('aria-label',`Hold progress ${state.elapsed}`);
</script>
</body></html>
